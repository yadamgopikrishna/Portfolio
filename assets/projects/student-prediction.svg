<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" />
  </g>
  <rect x="30" y="30" width="740" height="440" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="2" />
  <circle cx="55" cy="55" r="6" fill="#ef4444"/>
  <circle cx="75" cy="55" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="6" fill="#10b981"/>
  <text x="400" y="60" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">ML Student Performance Analytics • Scikit-Learn Model</text>
  
  <rect x="50" y="85" width="280" height="360" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
  <text x="70" y="115" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Feature Weights (R² = 0.94)</text>
  
  <text x="70" y="150" fill="#cbd5e1" font-family="sans-serif" font-size="12">Study Hours / Week</text>
  <rect x="70" y="160" width="240" height="8" rx="4" fill="#334155"/>
  <rect x="70" y="160" width="215" height="8" rx="4" fill="url(#cyan-grad)" filter="url(#glow1)"/>
  
  <text x="70" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="12">Attendance Rate (92%)</text>
  <rect x="70" y="205" width="240" height="8" rx="4" fill="#334155"/>
  <rect x="70" y="205" width="190" height="8" rx="4" fill="url(#cyan-grad)"/>
  
  <text x="70" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="12">Previous Exam Scores</text>
  <rect x="70" y="250" width="240" height="8" rx="4" fill="#334155"/>
  <rect x="70" y="250" width="170" height="8" rx="4" fill="url(#cyan-grad)"/>
  
  <text x="70" y="285" fill="#cbd5e1" font-family="sans-serif" font-size="12">Assignment Submissions</text>
  <rect x="70" y="295" width="240" height="8" rx="4" fill="#334155"/>
  <rect x="70" y="295" width="150" height="8" rx="4" fill="url(#cyan-grad)"/>
  
  <rect x="70" y="335" width="240" height="85" rx="8" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
  <text x="85" y="360" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Predicted Final Grade</text>
  <text x="85" y="395" fill="#38bdf8" font-family="sans-serif" font-size="32" font-weight="900">91.8% <tspan font-size="14" fill="#10b981">(Grade A+)</tspan></text>

  <rect x="350" y="85" width="400" height="360" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
  <text x="375" y="115" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Predicted vs Actual Trajectory</text>
  
  <path d="M380 380 Q 430 340, 480 300 T 580 210 T 680 160 T 720 130" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow1)"/>
  <path d="M380 395 Q 430 355, 480 325 T 580 230 T 680 185 T 720 145" fill="none" stroke="#a855f7" stroke-dasharray="6 6" stroke-width="3"/>
  
  <circle cx="380" cy="380" r="5" fill="#00f2fe"/>
  <circle cx="480" cy="300" r="5" fill="#00f2fe"/>
  <circle cx="580" cy="210" r="5" fill="#00f2fe"/>
  <circle cx="680" cy="160" r="5" fill="#00f2fe"/>
  <circle cx="720" cy="130" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

  <g transform="translate(540, 390)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
    <text x="10" y="4" fill="#94a3b8" font-family="sans-serif" font-size="11">Model Regression</text>
    <circle cx="115" cy="0" r="4" fill="#a855f7"/>
    <text x="125" y="4" fill="#94a3b8" font-family="sans-serif" font-size="11">Ground Truth</text>
  </g>
