<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="poly-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <rect x="40" y="30" width="720" height="440" rx="16" fill="#111827" fill-opacity="0.8" stroke="#1f2937" stroke-width="2"/>
  <text x="60" y="65" fill="#f9fafb" font-family="sans-serif" font-size="16" font-weight="bold">Computer Vision • Multi-Class Neural Image Classifier</text>
  
  <rect x="60" y="90" width="320" height="280" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <circle cx="220" cy="220" r="80" fill="#0e7490" fill-opacity="0.3"/>
  <polygon points="220,160 270,260 170,260" fill="#10b981" fill-opacity="0.4"/>
  
  <rect x="130" y="140" width="180" height="160" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>
  <rect x="130" y="116" width="125" height="24" rx="4" fill="#10b981"/>
  <text x="136" y="132" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">Object: 98.7% Conf</text>
  
  <line x1="210" y1="220" x2="230" y2="220" stroke="#38bdf8" stroke-width="2"/>
  <line x1="220" y1="210" x2="220" y2="230" stroke="#38bdf8" stroke-width="2"/>
  
  <text x="60" y="400" fill="#9ca3af" font-family="sans-serif" font-size="12">Input Dimensions: 224x224x3 • Batch: 32 • Preprocessing: Normalization &amp; Augmentation</text>

  <rect x="410" y="90" width="330" height="350" rx="12" fill="#1f2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
  <text x="430" y="120" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Class Probability Distribution</text>
  
  <text x="430" y="155" fill="#e5e7eb" font-family="sans-serif" font-size="12">Class 01: Identified Target (98.7%)</text>
  <rect x="430" y="165" width="290" height="10" rx="5" fill="#374151"/>
  <rect x="430" y="165" width="286" height="10" rx="5" fill="url(#poly-grad)" />
  
  <text x="430" y="205" fill="#9ca3af" font-family="sans-serif" font-size="12">Class 02: Secondary Feature (0.8%)</text>
  <rect x="430" y="215" width="290" height="10" rx="5" fill="#374151"/>
  <rect x="430" y="215" width="20" height="10" rx="5" fill="#6b7280"/>

  <text x="430" y="255" fill="#9ca3af" font-family="sans-serif" font-size="12">Class 03: Background Noise (0.5%)</text>
  <rect x="430" y="265" width="290" height="10" rx="5" fill="#374151"/>
  <rect x="430" y="265" width="14" height="10" rx="5" fill="#6b7280"/>

  <rect x="430" y="305" width="290" height="115" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="445" y="330" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">Architecture: CNN + Softmax</text>
  <text x="445" y="352" fill="#d1d5db" font-family="sans-serif" font-size="11">• Loss Function: Categorical Cross-Entropy</text>
  <text x="445" y="372" fill="#d1d5db" font-family="sans-serif" font-size="11">• Optimizer: Adam (lr=0.001) with Dropout (0.3)</text>
  <text x="445" y="392" fill="#d1d5db" font-family="sans-serif" font-size="11">• Inference Time: 18ms on GPU / 64ms on CPU</text>
</svg>