<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-agri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051f15" />
      <stop offset="50%" stop-color="#0a3622" />
      <stop offset="100%" stop-color="#02140d" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="card-agri" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)" />
      <stop offset="100%" stop-color="rgba(5, 31, 21, 0.9)" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-agri)" rx="16"/>

  <!-- Top Browser Bar -->
  <rect x="0" y="0" width="800" height="42" fill="rgba(3, 20, 14, 0.95)"/>
  <circle cx="25" cy="21" r="5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="59" cy="21" r="5" fill="#10b981"/>
  <rect x="100" y="10" width="380" height="22" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="115" y="25" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="11">agriseed-marketplace.org/farmers-hub</text>
  <rect x="680" y="10" width="95" height="22" rx="6" fill="#10b981"/>
  <text x="692" y="25" fill="#042f2e" font-family="sans-serif" font-size="10" font-weight="bold">FLASK + MONGO</text>

  <!-- Hero Header -->
  <rect x="40" y="65" width="720" height="85" rx="12" fill="url(#card-agri)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
  <rect x="40" y="65" width="6" height="85" fill="url(#emerald-glow)" rx="3"/>
  <text x="65" y="100" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900">🌾 AgriSeed — Direct Agricultural Marketplace</text>
  <text x="65" y="125" fill="#34d399" font-family="sans-serif" font-size="13">Connecting Rural Farmers Directly with Certified Seed &amp; Fertilizer Producers</text>

  <!-- Marketplace Stats & Filter Bar -->
  <rect x="40" y="165" width="480" height="38" rx="8" fill="rgba(5, 31, 21, 0.8)" stroke="#10b981" stroke-width="1"/>
  <text x="60" y="189" fill="#94a3b8" font-family="sans-serif" font-size="12">🌱 Search Certified Hybrid Paddy Seeds, Organic NPK, Bio-Pesticides...</text>
  <rect x="535" y="165" width="105" height="38" rx="8" fill="#10b981"/>
  <text x="555" y="189" fill="#042f2e" font-family="sans-serif" font-size="12" font-weight="bold">Search Seeds</text>
  <rect x="650" y="165" width="110" height="38" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="668" y="189" fill="#ffffff" font-family="sans-serif" font-size="12">Cart (3 Items)</text>

  <!-- Product Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(40, 220)">
    <rect width="225" height="190" rx="10" fill="url(#card-agri)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <rect x="15" y="15" width="85" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
    <text x="25" y="29" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">HYBRID SEED</text>
    <text x="15" y="60" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">BPT 5204 (Sona)</text>
    <text x="15" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">High yield, disease-resistant premium certified paddy seed (25kg).</text>
    <text x="15" y="125" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">₹1,150 <tspan font-size="11" fill="#94a3b8" text-decoration="line-through">₹1,450</tspan></text>
    <rect x="15" y="145" width="195" height="32" rx="6" fill="#10b981"/>
    <text x="75" y="166" fill="#042f2e" font-family="sans-serif" font-size="12" font-weight="bold">Direct Order →</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(285, 220)">
    <rect width="225" height="190" rx="10" fill="url(#card-agri)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <rect x="15" y="15" width="95" height="20" rx="4" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8"/>
    <text x="25" y="29" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">BIO-FERTILIZER</text>
    <text x="15" y="60" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Organic NPK 19:19</text>
    <text x="15" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">Water soluble balanced plant nutrients for enhanced crop growth.</text>
    <text x="15" y="125" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">₹820 <tspan font-size="11" fill="#94a3b8" text-decoration="line-through">₹990</tspan></text>
    <rect x="15" y="145" width="195" height="32" rx="6" fill="#10b981"/>
    <text x="75" y="166" fill="#042f2e" font-family="sans-serif" font-size="12" font-weight="bold">Direct Order →</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(535, 220)">
    <rect width="225" height="190" rx="10" fill="url(#card-agri)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <rect x="15" y="15" width="90" height="20" rx="4" fill="rgba(234, 179, 8, 0.2)" stroke="#eab308"/>
    <text x="25" y="29" fill="#eab308" font-family="sans-serif" font-size="10" font-weight="bold">CROP PROTECT</text>
    <text x="15" y="60" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Neem Bio-Extract</text>
    <text x="15" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">100% natural botanical pest repellent certified for organic farming.</text>
    <text x="15" y="125" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">₹450 <tspan font-size="11" fill="#94a3b8" text-decoration="line-through">₹550</tspan></text>
    <rect x="15" y="145" width="195" height="32" rx="6" fill="#10b981"/>
    <text x="75" y="166" fill="#042f2e" font-family="sans-serif" font-size="12" font-weight="bold">Direct Order →</text>
  </g>
</svg>
