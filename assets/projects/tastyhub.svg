<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-tasty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0b05" />
      <stop offset="50%" stop-color="#2d130a" />
      <stop offset="100%" stop-color="#0f0502" />
    </linearGradient>
    <linearGradient id="orange-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="card-tasty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(249, 115, 22, 0.15)" />
      <stop offset="100%" stop-color="rgba(20, 8, 4, 0.95)" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-tasty)" rx="16"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="800" height="42" fill="rgba(15, 5, 2, 0.9)"/>
  <circle cx="25" cy="21" r="5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="59" cy="21" r="5" fill="#10b981"/>
  <text x="85" y="25" fill="#fdba74" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">🍔 TastyHub — Mobile Food Discovery &amp; Delivery (Flutter &amp; Dart)</text>
  <rect x="690" y="10" width="85" height="22" rx="6" fill="#f97316"/>
  <text x="702" y="25" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">FLUTTER</text>

  <!-- Phone Mockup Frame in Center -->
  <g transform="translate(100, 60)">
    <rect width="600" height="360" rx="14" fill="url(#card-tasty)" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1.5"/>
    
    <!-- Hero Banner -->
    <rect x="25" y="20" width="550" height="80" rx="10" fill="url(#orange-red)"/>
    <text x="45" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900">Delicious Meals Delivered Fast</text>
    <text x="45" y="80" fill="#ffedd5" font-family="sans-serif" font-size="12">Explore Top Rated Restaurants &amp; Cloud Kitchens in Your City</text>

    <!-- Food Categories -->
    <g transform="translate(25, 120)">
      <rect x="0" y="0" width="125" height="45" rx="8" fill="rgba(255,255,255,0.08)" stroke="#f97316"/>
      <text x="15" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">🍕 Pizzas</text>

      <rect x="140" y="0" width="125" height="45" rx="8" fill="rgba(255,255,255,0.05)"/>
      <text x="155" y="28" fill="#fed7aa" font-family="sans-serif" font-size="12">🍔 Burgers</text>

      <rect x="280" y="0" width="125" height="45" rx="8" fill="rgba(255,255,255,0.05)"/>
      <text x="295" y="28" fill="#fed7aa" font-family="sans-serif" font-size="12">🍛 Biryanis</text>

      <rect x="420" y="0" width="125" height="45" rx="8" fill="rgba(255,255,255,0.05)"/>
      <text x="435" y="28" fill="#fed7aa" font-family="sans-serif" font-size="12">🥗 Healthy</text>
    </g>

    <!-- Restaurant Items Grid -->
    <g transform="translate(25, 185)">
      <!-- Item 1 -->
      <rect width="170" height="150" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(249, 115, 22, 0.2)"/>
      <text x="15" y="30" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Paneer Tikka Pizza</text>
      <text x="15" y="50" fill="#f97316" font-family="sans-serif" font-size="11">⭐ 4.8 (1.2k+)</text>
      <text x="15" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">Fresh mozzarella &amp; tandoori paneer.</text>
      <text x="15" y="105" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">₹299</text>
      <rect x="15" y="115" width="140" height="24" rx="4" fill="#f97316"/>
      <text x="55" y="131" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Add to Cart</text>

      <!-- Item 2 -->
      <g transform="translate(190, 0)">
        <rect width="170" height="150" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(249, 115, 22, 0.2)"/>
        <text x="15" y="30" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Classic Cheese Burger</text>
        <text x="15" y="50" fill="#f97316" font-family="sans-serif" font-size="11">⭐ 4.6 (850+)</text>
        <text x="15" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">Crispy patty with cheddar slice &amp; fries.</text>
        <text x="15" y="105" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">₹189</text>
        <rect x="15" y="115" width="140" height="24" rx="4" fill="#f97316"/>
        <text x="55" y="131" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Add to Cart</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(380, 0)">
        <rect width="170" height="150" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(249, 115, 22, 0.2)"/>
        <text x="15" y="30" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Hyderabadi Dum Biryani</text>
        <text x="15" y="50" fill="#f97316" font-family="sans-serif" font-size="11">⭐ 4.9 (3.4k+)</text>
        <text x="15" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">Aromatic basmati rice with mirchi ka salan.</text>
        <text x="15" y="105" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">₹349</text>
        <rect x="15" y="115" width="140" height="24" rx="4" fill="#f97316"/>
        <text x="55" y="131" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Add to Cart</text>
      </g>
    </g>
  </g>
</svg>
